<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860},&quot;startRole&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;instructor&quot;,&quot;student&quot;],&quot;default&quot;:&quot;instructor&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;submissionMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;COLLECTIVE&quot;,&quot;INDIVIDUAL&quot;],&quot;default&quot;:&quot;COLLECTIVE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;}}">
class Component extends DCLogic {
  h = (...a) => React.createElement(...a);
  C() { return window.CollageAIDesignSystem_321087 || {}; }

  STAGE = {
    prep:       { icon: 'IconPersonOutlined',     tint: '#0382ED', soft: '#EAF4FE', label: 'Individual prep' },
    discuss:    { icon: 'IconGroupsOutlined',     tint: '#8A3FFC', soft: '#F4ECFE', label: 'Team discussion' },
    collective: { icon: 'IconGroupOutlined',      tint: '#FF6713', soft: '#FFF0E6', label: 'Collective submission' },
    individual: { icon: 'IconAssignmentOutlined', tint: '#002341', soft: '#E9EEF3', label: 'Individual final' },
    assess:     { icon: 'IconGradeOutlined',      tint: '#0E7C57', soft: '#E7F5EF', label: 'Assessment' },
  };

  data = {
    course: { name: 'Introduction to Engineering', code: 'ENGR 101', term: 'Fall 2026', students: 24, teams: 6 },
    activity: {
      title: 'Bridge Design Decision',
      objective: 'Evaluate structural options against site constraints and justify a load-bearing decision.',
      due: 'Individual due Wed 11:59pm · Team stage Thu in class',
      questions: [
        { n: 1, type: 'Multiple choice', prompt: 'Which bridge structure is most appropriate for the proposed 90 m span over a deep gorge?', options: ['Beam bridge', 'Arch bridge', 'Suspension bridge', 'Cable-stayed bridge'] },
        { n: 2, type: 'Long response', prompt: 'Explain the reasoning behind your structural choice with reference to the site constraints.' },
        { n: 3, type: 'Numerical', prompt: 'Calculate the expected axial load (kN) on one main cable at midspan.' },
        { n: 4, type: 'Handwritten upload', prompt: 'Upload your written calculations supporting Q3.' },
        { n: 5, type: 'Short response', prompt: 'Identify one important design tradeoff in your chosen structure.' },
      ],
    },
    team: { name: 'Team 3', number: 3 },
    members: [
      { id: 'mc', name: 'Maya Chen', initials: 'MC', me: true, tint: '#0382ED' },
      { id: 'lo', name: 'Liam Ortiz', initials: 'LO', tint: '#8A3FFC' },
      { id: 'pn', name: 'Priya Nair', initials: 'PN', tint: '#0E7C57' },
      { id: 'sw', name: 'Sam Whitfield', initials: 'SW', tint: '#FF6713' },
    ],
    // original individual responses per member, keyed by question index
    originals: {
      mc: { q1: 'Suspension bridge', q2: 'The 90 m span and deep gorge rule out beam and arch; a suspension bridge carries the long span efficiently in tension.', q3: '≈ 1,180 kN', q5: 'Suspension needs large anchorages — costly on this rock.', status: 'Complete', done: true },
      lo: { q1: 'Cable-stayed bridge', q2: 'Cable-stayed is cheaper than suspension at this span and stiffer under moving loads, which matters for the gorge wind.', q3: '≈ 1,050 kN', q5: 'More deck deflection under asymmetric load.', status: 'Complete', done: true },
      pn: { q1: 'Suspension bridge', q2: 'Suspension handles the span; tension members are efficient. I was unsure about anchorage into the rock.', q3: '≈ 1,210 kN', q5: 'Long construction time.', status: 'Complete', done: true },
      sw: { q1: 'Arch bridge', q2: 'An arch uses the gorge walls as abutments and is durable, though I am not certain 90 m is within range.', q3: '≈ 1,400 kN', q5: 'High formwork cost during construction.', status: 'Needs review', done: true },
    },
    rubric: [
      { c: 'Correct structure choice', pts: 4, desc: 'Selects a structure appropriate to span and site.' },
      { c: 'Quality of reasoning', pts: 6, desc: 'Justification references constraints and tradeoffs.' },
      { c: 'Load calculation accuracy', pts: 6, desc: 'Correct method, values and arithmetic.' },
      { c: 'Units & assumptions', pts: 2, desc: 'States units and reasonable assumptions.' },
      { c: 'Tradeoff analysis', pts: 2, desc: 'Identifies a meaningful design tradeoff.' },
    ],
    oralRubric: [
      { c: 'Clarity of explanation', pts: 3, desc: 'Presents the reasoning clearly and audibly.' },
      { c: 'Depth of understanding', pts: 4, desc: 'Shows genuine grasp of the underlying concept.' },
      { c: 'Responds to follow-up', pts: 3, desc: 'Handles a probing question on the spot.' },
    ],
  };

  teamMembers(n) {
    if (n === 3) return this.data.members;
    const pool = [
      [['Ada R.', 'AR', '#0382ED'], ['Ben T.', 'BT', '#8A3FFC'], ['Cara F.', 'CF', '#0E7C57'], ['Diego L.', 'DL', '#FF6713']],
      [['Erin N.', 'EN', '#0382ED'], ['Fatima O.', 'FO', '#8A3FFC'], ['Gus K.', 'GK', '#0E7C57'], ['Hana P.', 'HP', '#FF6713']],
      [['Ivan V.', 'IV', '#0382ED'], ['Jo W.', 'JW', '#8A3FFC'], ['Kai M.', 'KM', '#0E7C57']],
      [['Lena S.', 'LS', '#0382ED'], ['Marco D.', 'MD', '#8A3FFC'], ['Nia B.', 'NB', '#0E7C57'], ['Omar H.', 'OH', '#FF6713']],
      [['Pia R.', 'PR', '#0382ED'], ['Quinn A.', 'QA', '#8A3FFC'], ['Rafe T.', 'RT', '#0E7C57']],
    ];
    const set = pool[(n - 1) % pool.length];
    return set.map(m => ({ id: m[1].toLowerCase(), name: m[0], initials: m[1], tint: m[2] }));
  }

  state = {
    role: 'instructor',
    screen: 'i-dashboard',
    mode: 'COLLECTIVE', // COLLECTIVE | INDIVIDUAL
    ready: false,
    // student flow state
    resp: { q1: '', q2: '', q3: '', q5: '' },
    ocrCorrected: false,
    prepSubmitted: false,
    collectiveText: '',
    individualText: '',
    participation: { mc: true, lo: false, pn: false, sw: false },
    // instructor
    rosterStep: 1,
    aiGenerated: false,
    grades: {}, // per student criterion overrides
  };

  componentDidMount() {
    const p = this.props || {};
    const patch = {};
    if (p.startRole === 'student') { patch.role = 'student'; patch.screen = 's-activities'; }
    if (p.submissionMode === 'INDIVIDUAL' || p.submissionMode === 'COLLECTIVE') patch.mode = p.submissionMode;
    if (this.C().Button) this.setState({ ready: true, ...patch });
    else { Object.assign(this.state, patch); this._t = setInterval(() => { if (this.C().Button) { clearInterval(this._t); this.setState({ ready: true }); } }, 60); }
  }
  componentWillUnmount() { if (this._t) clearInterval(this._t); }

  go(screen) { this.setState({ screen }); const m = document.getElementById('tlp-main'); if (m) m.scrollTop = 0; }
  set(patch) { this.setState(patch); }

  icon(name, size = 18, color) { const { Icon } = this.C(); return Icon ? this.h(Icon, { name, size, style: color ? { color } : undefined }) : null; }

  // ---- shared UI helpers ----
  pageHead(title, subtitle, actions) {
    return this.h('div', { style: { display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 24, marginBottom: 24, flexWrap: 'wrap' } },
      this.h('div', null,
        this.h('h1', { style: { fontFamily: '"Copernicus Trial", Georgia, serif', fontSize: 30, fontWeight: 600, letterSpacing: '-0.02em', margin: 0, color: '#002341' } }, title),
        subtitle ? this.h('p', { style: { margin: '6px 0 0', color: '#737373', fontSize: 15, maxWidth: 680 } }, subtitle) : null,
      ),
      actions ? this.h('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap' } }, actions) : null,
    );
  }

  stageChip(key, opts = {}) {
    const s = this.STAGE[key];
    return this.h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 6, padding: opts.big ? '6px 12px' : '3px 9px', borderRadius: 999, background: s.soft, color: s.tint, fontSize: opts.big ? 13 : 12, fontWeight: 600, border: `1px solid ${s.tint}22` } },
      this.icon(s.icon, opts.big ? 16 : 14), s.label);
  }

  statCard(label, value, icon, tint, sub) {
    return this.h('div', { style: { background: '#fff', border: '1px solid #E5E5E5', borderRadius: 14, padding: 18, boxShadow: '0 1px 2px rgba(0,0,0,0.04)', flex: '1 1 160px', minWidth: 150 } },
      this.h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 } },
        this.h('span', { style: { width: 30, height: 30, borderRadius: 8, background: tint + '18', color: tint, display: 'grid', placeItems: 'center' } }, this.icon(icon, 18)),
        this.h('span', { style: { color: '#737373', fontSize: 13, fontWeight: 500 } }, label)),
      this.h('div', { style: { fontSize: 28, fontWeight: 700, color: '#0A0A0A', fontFamily: '"Copernicus Trial", serif' } }, value),
      sub ? this.h('div', { style: { color: '#9a9a9a', fontSize: 12, marginTop: 2 } }, sub) : null,
    );
  }

  panel(children, style = {}) {
    return this.h('div', { style: { background: '#fff', border: '1px solid #E5E5E5', borderRadius: 14, boxShadow: '0 1px 2px rgba(0,0,0,0.04)', ...style } }, children);
  }

  avatar(m, size = 30) {
    return this.h('span', { style: { width: size, height: size, borderRadius: '50%', background: m.tint, color: '#fff', display: 'inline-grid', placeItems: 'center', fontSize: size * 0.38, fontWeight: 700, flex: '0 0 auto' } }, m.initials);
  }

  btn(label, opts = {}) {
    const { Button } = this.C();
    return this.h(Button, { variant: opts.variant || 'primary', size: opts.size, onClick: opts.onClick, disabled: opts.disabled,
      startIcon: opts.icon ? this.icon(opts.icon, 16) : undefined, fullWidth: opts.fullWidth }, label);
  }

  sparkle(label) {
    return this.h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 6, color: '#FF6713', fontWeight: 600, fontSize: 13 } }, this.icon('IconAutoAwesomeOutlined', 15, '#FF6713'), label);
  }

  // ---- navigation ----
  navModel() {
    const s = this.state.screen;
    if (this.state.role === 'instructor') {
      return [
        { label: 'Teaching', items: [
          { icon: 'IconDashboardOutlined', label: 'Course dashboard', k: 'i-dashboard' },
          { icon: 'IconLibraryBooksOutlined', label: 'Activity library', k: 'i-library' },
        ]},
        { label: 'Roster & teams', items: [
          { icon: 'IconGroupOutlined', label: 'Roster & import', k: 'i-roster' },
          { icon: 'IconGroupsOutlined', label: 'Team management', k: 'i-teams' },
        ]},
        { label: 'Authoring', items: [
          { icon: 'IconEditOutlined', label: 'Activity builder', k: 'i-builder' },
          { icon: 'IconAutoAwesomeOutlined', label: 'AI generation', k: 'i-ai' },
          { icon: 'IconChecklistOutlined', label: 'Rubric builder', k: 'i-rubric' },
        ]},
        { label: 'Class & assessment', items: [
          { icon: 'IconInsertChartOutlined', label: 'Live dashboard', k: 'i-live' },
          { icon: 'IconGradeOutlined', label: 'Grading', k: 'i-grading' },
          { icon: 'IconAnalyticsOutlined', label: 'Results & analytics', k: 'i-results' },
        ]},
      ].map(sec => ({ label: sec.label, items: sec.items.map(it => ({ icon: it.icon, label: it.label, active: s === it.k, onClick: () => this.go(it.k) })) }));
    }
    const finalK = this.state.mode === 'COLLECTIVE' ? 's-collective' : 's-individual';
    return [
      { label: 'Learn', items: [
        { icon: 'IconAutoStoriesOutlined', label: 'My activities', k: 's-activities' },
      ]},
      { label: 'Bridge Design Decision', items: [
        { icon: 'IconPersonOutlined', label: 'Individual prep', k: 's-question' },
        { icon: 'IconGroupsOutlined', label: 'Team discussion', k: 's-discussion' },
        { icon: 'IconAssignmentOutlined', label: 'Final submission', k: finalK },
        { icon: 'IconGradeOutlined', label: 'Grades & feedback', k: 's-grades' },
      ]},
    ].map(sec => ({ label: sec.label, items: sec.items.map(it => ({ icon: it.icon, label: it.label, active: s === it.k || (it.k === finalK && s === 's-participation'), onClick: () => this.go(it.k) })) }));
  }

  renderSidebar() {
    const { AppSidebar } = this.C();
    const role = this.state.role;
    const rail = [
      { icon: 'IconSchoolOutlined', title: 'Instructor', active: role === 'instructor', onClick: () => this.setState({ role: 'instructor', screen: 'i-dashboard' }) },
      { icon: 'IconPersonOutlined', title: 'Student', active: role === 'student', onClick: () => this.setState({ role: 'student', screen: 's-activities' }) },
    ];
    const user = role === 'instructor'
      ? { name: 'Dr. Elena Alvarez', email: 'Instructor · ENGR 101', initials: 'EA' }
      : { name: 'Maya Chen', email: 'Student · Team 3', initials: 'MC' };
    return this.h(AppSidebar, { railItems: rail, sections: this.navModel(), user, width: 288, style: { flex: '0 0 auto', height: '100vh' } });
  }

  renderScreen() {
    const fn = this['screen_' + this.state.screen.replace(/-/g, '_')];
    if (fn) return fn.call(this);
    return this.h('div', { style: { padding: 40, color: '#737373' } }, 'Screen coming up.');
  }

  renderVals() {
    if (!this.state.ready) {
      return { app: this.h('div', { style: { display: 'grid', placeItems: 'center', height: '100vh', color: '#002341', fontFamily: 'Geist' } }, 'Loading…') };
    }
    const app = this.h('div', { style: { display: 'flex', minHeight: '100vh', background: '#F5F1E6' } },
      this.renderSidebar(),
      this.h('main', { id: 'tlp-main', style: { flex: 1, height: '100vh', overflowY: 'auto' } },
        this.renderTopBar(),
        this.h('div', { style: { maxWidth: 1180, margin: '0 auto', padding: '28px 36px 80px' } }, this.renderScreen()),
      ),
    );
    return { app };
  }

  renderTopBar() {
    const role = this.state.role;
    return this.h('div', { style: { position: 'sticky', top: 0, zIndex: 20, background: 'rgba(245,241,230,0.85)', backdropFilter: 'blur(8px)', borderBottom: '1px solid #E7E1D2', padding: '12px 36px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
      this.h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, color: '#737373', fontSize: 13 } },
        this.h('span', { style: { fontWeight: 600, color: '#002341' } }, this.data.course.code),
        this.icon('IconChevronRightOutlined', 16, '#c4bda9'),
        this.h('span', null, role === 'instructor' ? 'Instructor workspace' : 'Bridge Design Decision')),
      this.h('div', { style: { display: 'flex', alignItems: 'center', gap: 14 } },
        role === 'student' ? this.h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#737373' } },
          this.icon('IconGroupsOutlined', 16, '#8A3FFC'), 'Team 3') : null,
        this.icon('IconNotificationsOutlined', 20, '#737373'),
        this.icon('IconHelpOutlineOutlined', 20, '#737373')),
    );
  }

  // ================= INSTRUCTOR: DASHBOARD =================
  screen_i_dashboard() {
    const { Badge } = this.C();
    return this.h(React.Fragment, null,
      this.pageHead('Course dashboard', `${this.data.course.name} · ${this.data.course.term}`,
        [this.btn('New activity', { icon: 'IconAddOutlined', onClick: () => this.go('i-builder') }),
         this.btn('Import roster', { variant: 'outline', icon: 'IconFileUploadOutlined', onClick: () => this.go('i-roster') })]),
      this.h('div', { style: { display: 'flex', gap: 14, flexWrap: 'wrap', marginBottom: 22 } },
        this.statCard('Students', '24', 'IconGroupOutlined', '#0382ED', 'across 6 teams'),
        this.statCard('Prep complete', '21 / 24', 'IconCheckCircleOutlined', '#0E7C57', '88% ready'),
        this.statCard('Needs review', '3', 'IconWarningAmberOutlined', '#FF6713', 'flagged submissions'),
        this.statCard('Awaiting grade', '4 teams', 'IconGradeOutlined', '#8A3FFC', 'Bridge activity'),
      ),
      this.h('div', { style: { display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 18 } },
        this.panel(this.h('div', { style: { padding: 22 } },
          this.h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 } },
            this.h('h3', { style: { margin: 0, fontSize: 16, color: '#002341' } }, 'Active activity'),
            this.h(Badge, { variant: 'orange' }, 'Team stage today')),
          this.h('div', { style: { display: 'flex', alignItems: 'center', gap: 14, padding: 16, background: '#FAF7EF', borderRadius: 12, border: '1px solid #EFE9DA' } },
            this.h('span', { style: { width: 46, height: 46, borderRadius: 10, background: '#002341', color: '#FCF8EC', display: 'grid', placeItems: 'center' } }, this.icon('IconAssignmentOutlined', 24)),
            this.h('div', { style: { flex: 1 } },
              this.h('div', { style: { fontWeight: 600, fontSize: 15, color: '#002341' } }, this.data.activity.title),
              this.h('div', { style: { color: '#737373', fontSize: 13, marginTop: 2 } }, this.data.activity.due)),
            this.btn('Open live view', { size: 'sm', onClick: () => this.go('i-live') })),
          this.h('div', { style: { display: 'flex', gap: 10, marginTop: 16, flexWrap: 'wrap' } },
            this.stageChip('prep'), this.icon('IconArrowForwardOutlined', 16, '#c4bda9'),
            this.stageChip('discuss'), this.icon('IconArrowForwardOutlined', 16, '#c4bda9'),
            this.stageChip(this.state.mode === 'COLLECTIVE' ? 'collective' : 'individual'), this.icon('IconArrowForwardOutlined', 16, '#c4bda9'),
            this.stageChip('assess')),
        )),
        this.panel(this.h('div', { style: { padding: 22 } },
          this.h('h3', { style: { margin: '0 0 12px', fontSize: 16, color: '#002341' } }, 'Prep by team'),
          this.h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
            [['Team 1',4],['Team 2',4],['Team 3',4],['Team 4',3],['Team 5',3],['Team 6',3]].map(([t,n]) =>
              this.h('div', { key: t, style: { display: 'flex', alignItems: 'center', gap: 10 } },
                this.h('span', { style: { width: 58, fontSize: 13, color: '#525252' } }, t),
                this.h('div', { style: { flex: 1, height: 8, borderRadius: 6, background: '#EFE9DA', overflow: 'hidden' } },
                  this.h('div', { style: { width: (n/4*100)+'%', height: '100%', background: n===4 ? '#0E7C57' : '#FF6713' } })),
                this.h('span', { style: { fontSize: 12, color: '#737373', width: 30, textAlign: 'right' } }, n+'/4'))),
          ))),
      ),
    );
  }

  // ================= INSTRUCTOR: ACTIVITY LIBRARY =================
  screen_i_library() {
    const { Badge } = this.C();
    const rows = [
      { t: 'Bridge Design Decision', mode: 'COLLECTIVE', status: 'Team stage today', tint: 'orange', q: 5 },
      { t: 'Statics Warm-up: Free-body Diagrams', mode: 'INDIVIDUAL', status: 'Grading', tint: 'lavender', q: 4 },
      { t: 'Materials Selection Case', mode: 'INDIVIDUAL', status: 'Draft', tint: 'secondary', q: 6 },
      { t: 'Truss Analysis Project Milestone', mode: 'COLLECTIVE', status: 'Scheduled', tint: 'sky', q: 3 },
    ];
    return this.h(React.Fragment, null,
      this.pageHead('Activity library', 'Every activity keeps individual prep, discussion and assessed work structurally separate.',
        [this.btn('Create manually', { icon: 'IconEditOutlined', variant: 'outline', onClick: () => this.go('i-builder') }),
         this.btn('Generate with AI', { icon: 'IconAutoAwesomeOutlined', onClick: () => this.go('i-ai') })]),
      this.h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 16 } },
        rows.map((r, i) => this.panel(this.h('div', { style: { padding: 20, cursor: 'pointer' }, onClick: () => this.go('i-builder') },
          this.h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 } },
            this.h('span', { style: { width: 40, height: 40, borderRadius: 10, background: '#EAF4FE', color: '#0382ED', display: 'grid', placeItems: 'center' } }, this.icon('IconAssignmentOutlined', 22)),
            this.h(Badge, { variant: r.tint }, r.status)),
          this.h('div', { style: { fontWeight: 600, fontSize: 16, color: '#002341', marginBottom: 6 } }, r.t),
          this.h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, color: '#737373', fontSize: 13 } },
            this.h('span', null, r.q + ' questions'),
            this.h('span', { style: { color: '#d9d3c4' } }, '·'),
            this.h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 5 } },
              this.icon(r.mode === 'COLLECTIVE' ? 'IconGroupOutlined' : 'IconAssignmentOutlined', 15, r.mode === 'COLLECTIVE' ? '#FF6713' : '#002341'),
              r.mode === 'COLLECTIVE' ? 'Collective submission' : 'Individual submission'))),
        { key: i })),
      ),
    );
  }

  activityBanner(stageKey, note) {
    const s = this.STAGE[stageKey];
    return this.panel(this.h('div', { style: { padding: 20, display: 'flex', alignItems: 'center', gap: 16, borderLeft: `4px solid ${s.tint}` } },
      this.h('span', { style: { width: 44, height: 44, borderRadius: 10, background: s.soft, color: s.tint, display: 'grid', placeItems: 'center', flex: '0 0 auto' } }, this.icon(s.icon, 24)),
      this.h('div', { style: { flex: 1 } },
        this.h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } }, this.stageChip(stageKey), this.h('span', { style: { fontWeight: 600, color: '#002341' } }, this.data.activity.title)),
        this.h('div', { style: { color: '#737373', fontSize: 13, marginTop: 4 } }, note || this.data.activity.objective)),

  spinPick() {
    const n = this.state.oralTeam;
    const members = this.teamMembers(n);
    const avail = this.availIdx(n);
    if (!avail.length) return;
    this.setState({ oralSpinning: true, oralPicked: avail[0], oralScores: {} });
    let ticks = 0;
    const total = 16 + Math.floor(Math.random() * 5);
    clearInterval(this._spin);
    this._spin = setInterval(() => {
      ticks++;
      this.setState({ oralPicked: avail[ticks % avail.length] });
      if (ticks >= total) {
        clearInterval(this._spin);
        const final = avail[Math.floor(Math.random() * avail.length)];
        this.setState({ oralPicked: final, oralSpinning: false, oralPhase: 'present' });
      }
    }, 90);
  }
