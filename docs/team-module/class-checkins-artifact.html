<style>
/* ===== Class Check-ins — self-contained team-based-learning tool =====
   Paper/ink aesthetic. System fonts + inline SVG only. Light + dark. */
:root{
  --paper:#fffcf2; --paper2:#fffcf2; --paper3:#fcf8ec; --canvas:#fbf9f3; --activeBg:#f5ead0;
  --ink:#002341; --ink2:#41637f; --ink3:#7d94a6;
  --line:#e5e5e5; --line2:#eee9dc;
  --purple:#dca2fd;
  --blue:#0382ed; --blueBg:#dbeeff;
  --amber:#b45309; --amberBg:#fdf1cd;
  --green:#15803d; --greenBg:#e2f2e8;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Snell Roundhand","Segoe Script","Bradley Hand","Comic Sans MS",cursive;
  --shadowCard:0 1px 0 0 rgba(0,35,65,.05);
  --shadowFloat:0 1px 2px 0 rgba(0,35,65,.10);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#00182a; --paper2:#063049; --paper3:#0e3354; --canvas:#002341; --activeBg:#0e3354;
    --ink:#fcf8ec; --ink2:#b7c8d5; --ink3:#88a2b5;
    --line:#12415f; --line2:#0d3450;
    --blue:#79c0ff; --blueBg:#0b3a5c;
    --amber:#e6b53c; --amberBg:#3a2f12;
    --green:#5cc98e; --greenBg:#0f3a2a;
    --shadowCard:0 1px 0 0 rgba(0,0,0,.25);
    --shadowFloat:0 1px 3px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="light"]{
  --paper:#fffcf2; --paper2:#fffcf2; --paper3:#fcf8ec; --canvas:#fbf9f3; --activeBg:#f5ead0;
  --ink:#002341; --ink2:#41637f; --ink3:#7d94a6;
  --line:#e5e5e5; --line2:#eee9dc;
  --blue:#0382ed; --blueBg:#dbeeff;
  --amber:#b45309; --amberBg:#fdf1cd;
  --green:#15803d; --greenBg:#e2f2e8;
  --shadowCard:0 1px 0 0 rgba(0,35,65,.05);
  --shadowFloat:0 1px 2px 0 rgba(0,35,65,.10);
}
:root[data-theme="dark"]{
  --paper:#00182a; --paper2:#063049; --paper3:#0e3354; --canvas:#002341; --activeBg:#0e3354;
  --ink:#fcf8ec; --ink2:#b7c8d5; --ink3:#88a2b5;
  --line:#12415f; --line2:#0d3450;
  --blue:#79c0ff; --blueBg:#0b3a5c;
  --amber:#e6b53c; --amberBg:#3a2f12;
  --green:#5cc98e; --greenBg:#0f3a2a;
  --shadowCard:0 1px 0 0 rgba(0,0,0,.25);
  --shadowFloat:0 1px 3px 0 rgba(0,0,0,.35);
}
#tbl-app,#tbl-app *{box-sizing:border-box}
#tbl-app{
  font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);
  background:var(--paper);min-height:100vh;max-width:100%;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-wrap:pretty;
}
#tbl-app input,#tbl-app textarea,#tbl-app select{font:inherit;color:inherit}#tbl-app button{font:inherit}
#tbl-app button{cursor:pointer}
#tbl-app svg{display:inline-block;vertical-align:middle}
#tbl-app *{scrollbar-width:thin;scrollbar-color:rgba(120,140,160,.4) transparent}
#tbl-app *::-webkit-scrollbar{width:8px;height:8px}
#tbl-app *::-webkit-scrollbar-track{background:transparent}
#tbl-app *::-webkit-scrollbar-thumb{background:rgba(120,140,160,.4);border-radius:9999px}
@keyframes tblPulse{0%,100%{opacity:1}50%{opacity:.32}}
@keyframes tblFade{from{opacity:0}to{opacity:1}}

/* layout */
.t-shell{min-height:100vh;display:flex;background:var(--paper);max-width:100%}
.t-sidebar{width:238px;flex:0 0 238px;display:flex;flex-direction:column;padding:22px 14px 14px}
.t-brand{font-family:var(--serif);font-size:21px;line-height:1.18;font-weight:700;letter-spacing:-.01em}
.t-ctxmeta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink2)}
.t-num{font-variant-numeric:tabular-nums}
.t-seg2{display:flex;gap:3px;margin-top:11px;padding:3px;border:1px solid var(--line);background:var(--paper3);border-radius:11px}
.t-segbtn{flex:1;border:1px solid transparent;background:transparent;color:var(--ink2);font-size:11.5px;padding:5px 8px;border-radius:8px;transition:background 120ms,color 120ms}
.t-segbtn.on{border-color:var(--ink);background:var(--ink);color:var(--paper3);font-weight:600}
.t-nav{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.t-navbtn{display:flex;align-items:center;gap:10px;height:38px;width:100%;padding:0 11px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink2);font-size:13.5px;text-align:left;transition:background 120ms,color 120ms}
.t-navbtn.on{border-color:var(--line);background:var(--activeBg);color:var(--ink);font-weight:600}
.t-navbtn span.lbl{flex:1;min-width:0;text-align:left}
.t-loopcard{border:1px solid var(--line);background:var(--paper3);border-radius:12px;padding:11px 12px;box-shadow:var(--shadowCard)}
.t-kicker{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.t-looprow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.t-lnum{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;flex:0 0 auto;border-radius:999px;background:var(--purple);color:#002341;font-size:11.5px;font-weight:600}
.t-themebtn{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;color:var(--ink2);font-size:12.5px;padding:9px 11px;border-radius:10px;transition:background 120ms}
.t-themebtn:hover{background:var(--paper3);color:var(--ink)}
.t-fac{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:10px}
.t-main{flex:1;min-width:0;max-width:100%;display:flex;padding:12px 12px 12px 0}
.t-narrow .t-main{padding:10px 10px 84px}
.t-canvas{flex:1;min-width:0;border:1px solid var(--line);background:var(--canvas);border-radius:16px;box-shadow:var(--shadowFloat);padding:26px 30px 34px}
.t-narrow .t-canvas{padding:16px 14px 24px}
.t-topstrip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.t-bottomnav{position:fixed;left:10px;right:10px;bottom:10px;z-index:40;display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:16px;background:var(--paper2);box-shadow:var(--shadowFloat)}
.t-bnbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--ink2);font-size:11px;padding:8px 4px}
.t-bnbtn.on{border-color:var(--line);background:var(--activeBg);color:var(--ink);font-weight:600}

/* headings */
.t-h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.t-h2{margin:0;font-family:var(--serif);font-size:18px;font-weight:700}
.t-sub{font-size:12px;color:var(--ink2)}
.t-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.t-spacer{flex:1}

/* chips + buttons */
.t-chip{font-size:10.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--paper3);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.t-chip.blue{border-color:var(--blue);background:var(--blueBg);color:var(--blue)}
.t-chip.amber{border-color:var(--amber);background:var(--amberBg);color:var(--amber)}
.t-chip.green{border-color:var(--green);background:var(--greenBg);color:var(--green)}
.t-chip.purple{border-color:var(--purple);background:rgba(220,162,253,.16);color:var(--ink)}
.t-btn{font-family:inherit;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font-size:12px;padding:5px 11px;border-radius:10px;cursor:pointer;box-shadow:var(--shadowCard)}
.t-btn.primary{border-color:var(--ink);background:var(--ink);color:var(--paper);box-shadow:none}
.t-btn.ghost{background:transparent;color:var(--ink2);box-shadow:none}
.t-btn.line{background:var(--paper3);color:var(--ink);box-shadow:none}
.t-btn.green{border-color:var(--green);background:var(--greenBg);color:var(--green);box-shadow:none}
.t-btn.amber{border-color:var(--amber);background:var(--amberBg);color:var(--amber);box-shadow:none}
.t-btn.sm{font-size:11px;padding:2px 8px}
.t-card{border:1px solid var(--line);background:var(--paper2);border-radius:10px;padding:13px}
.t-in{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 7px;font-size:13px;color:var(--ink)}
.t-in:focus{outline:1px solid var(--purple)}
.t-pill{border:1px solid var(--line);background:var(--paper2);color:var(--ink2);font-size:12px;padding:5px 12px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadowCard)}
.t-pill.on{border-color:var(--ink);background:var(--ink);color:var(--paper3);box-shadow:none}

/* avatar */
.t-av{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;flex:0 0 auto;color:#002341;font-weight:600;letter-spacing:.01em}

/* loop bar + cell key */
.t-loopbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);background:var(--paper3);border-radius:10px;margin-bottom:10px}
.t-looppill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 11px 3px 4px;border-radius:999px;border:1px solid var(--line);background:var(--paper3);color:var(--ink2)}
.t-looppill .n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:999px;background:var(--purple);color:#002341;font-size:10.5px;font-weight:600}
.t-key{display:flex;gap:9px 18px;flex-wrap:wrap;align-items:center;margin:0 0 10px;padding:10px 12px;border:1px solid var(--line);background:var(--paper2);border-radius:12px;font-size:11.5px;color:var(--ink2);box-shadow:var(--shadowCard)}
.t-keyitem{display:inline-flex;align-items:center;gap:6px}
.t-keyglyph{display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:6px;border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}

/* gradebook */
.t-gbwrap{border:1px solid var(--line);border-radius:10px;background:var(--paper2);overflow-x:auto;max-width:100%}
table.t-gb{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.t-gb th,table.t-gb td{padding:0}
.t-gbname{position:sticky;left:0;z-index:2;border-right:1px solid var(--line);text-align:left;min-width:210px}
th.t-gbname.hdr{z-index:3;background:var(--paper3);border-bottom:1px solid var(--line);padding:6px 10px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.t-grp{background:var(--paper3);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:left;padding:6px 10px}
.t-grp button{border:0;background:transparent;padding:0;color:var(--ink);font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:-.01em;text-align:left;cursor:pointer}
.t-grp .meta{font-size:11px;color:var(--ink3);margin-left:8px}
.t-th{background:var(--paper2);border-right:1px solid var(--line2);border-bottom:1px solid var(--line);border-left:1px solid var(--line2);text-align:left;padding:7px 10px;vertical-align:top;min-width:96px}
.t-th button{border:0;background:transparent;padding:0;color:var(--ink);font-size:12px;font-weight:600;display:block;text-align:left;cursor:pointer}
.t-th .meta{font-size:10.5px;color:var(--ink3);margin-top:2px;white-space:nowrap}
.t-th .summ{font-size:10.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-rowteam .t-gbname{background:var(--paper3);border-bottom:1px solid var(--line2);padding:5px 10px;font-weight:600;font-size:12.5px}
.t-rowstu .t-gbname{background:var(--paper2);border-bottom:1px solid var(--line2);padding:4px 10px 4px 24px;font-weight:400;font-size:12.5px}
.t-rowstu.unassigned .t-gbname{padding-left:10px}
.t-namecell{display:flex;align-items:center;gap:7px}
.t-caret{display:flex;align-items:center;border:0;background:transparent;padding:0;color:var(--ink2);width:18px;cursor:pointer}
.t-td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.t-cell{width:100%;min-width:70px;height:34px;display:flex;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;font-size:13.5px;font-variant-numeric:tabular-nums;transition:background 120ms,color 120ms,box-shadow 120ms;font-family:inherit;cursor:pointer}
.t-cell.mismatch{color:var(--line);cursor:default}
.t-cell.ring{box-shadow:inset 0 0 0 2px var(--purple)}
.t-pulse{animation:tblPulse 1.4s ease-in-out infinite}

/* stage bar */
.t-stagebar{display:flex;gap:2px}
.t-seg{flex:1 1 0;min-width:0;text-align:center;font-size:10.5px;letter-spacing:.02em;padding:5px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-left-width:0;color:var(--ink3)}
.t-seg:first-child{border-left-width:1px;border-top-left-radius:9px;border-bottom-left-radius:9px}
.t-seg:last-child{border-top-right-radius:9px;border-bottom-right-radius:9px}
.t-seg.done{background:var(--activeBg);color:var(--ink2)}
.t-seg.cur{background:var(--ink);color:var(--paper3);border-color:var(--ink);font-weight:600}

/* grid helpers */
.t-grid{display:grid;gap:12px}
.t-cards2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.t-cards3{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.t-autofit{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}

/* teams */
.t-teamcard{border:1px solid var(--line);background:var(--paper2);border-radius:10px;padding:12px}
.t-teamcard.under{border-color:var(--amber)}
.t-memberrow{display:flex;align-items:center;gap:7px;padding:3px 4px;border-bottom:1px solid var(--line2)}
.t-warn{margin-top:8px;display:flex;align-items:center;gap:6px;border:1px solid var(--amber);background:var(--amberBg);color:var(--amber);border-radius:10px;padding:4px 7px;font-size:11.5px}
.t-rolechip{border:1px solid var(--line);background:var(--paper3);color:var(--ink2);font-size:10px;padding:1px 7px;border-radius:999px;cursor:pointer;white-space:nowrap}
.t-x{border:0;background:transparent;color:var(--ink3);font-size:12px;padding:0 3px;cursor:pointer}
.t-x:hover{color:var(--ink)}

/* workspace tabs */
.t-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.t-tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink2);font-size:13px;padding:9px 13px;cursor:pointer}
.t-tab.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:600;font-family:var(--serif)}
.t-lensbox{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.t-lens{border:0;background:transparent;color:var(--ink2);font-size:12px;padding:5px 11px;cursor:pointer}
.t-lens.on{background:var(--ink);color:var(--paper)}
.t-stepcard{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--paper2);border-radius:12px;padding:11px 13px;box-shadow:var(--shadowCard);text-align:left;cursor:pointer;transition:background 120ms,border-color 120ms}
.t-stepcard.on{border-color:var(--purple);background:rgba(220,162,253,.16);box-shadow:none}
.t-stepcard.locked{opacity:.6}

/* panel + overlays */
.t-panel{position:fixed;top:12px;right:12px;bottom:12px;width:min(430px,92vw);z-index:45;display:flex;flex-direction:column;background:var(--paper2);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(0,35,65,.18);animation:tblFade 120ms;overflow:hidden}
.t-narrow .t-panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:86vh;border-radius:18px}
.t-panelhead{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
.t-panelbody{padding:14px;overflow-y:auto;flex:1}
.t-scan{margin-top:10px;cursor:zoom-in;border:1px solid var(--line);border-radius:12px;padding:12px 16px;overflow:hidden;background:repeating-linear-gradient(var(--paper2) 0px,var(--paper2) 25px,var(--line2) 25px,var(--line2) 26px)}
.t-scanline{font-family:var(--hand);font-size:17px;line-height:26px;color:var(--ink)}
.t-flag{background:var(--amberBg);color:var(--amber);border-bottom:1px solid var(--amber);padding:0 2px}
.t-overlay{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;animation:tblFade 120ms}
.t-modalback{position:fixed;inset:0;z-index:60;background:rgba(0,24,42,.6);display:flex;align-items:center;justify-content:center;padding:18px;animation:tblFade 120ms}
.t-modal{background:var(--paper2);border:1px solid var(--line);border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
.t-dz{border:1px dashed var(--line);background:var(--paper);border-radius:10px;padding:18px 14px;text-align:center;cursor:pointer;transition:all 120ms}
.t-uc{text-transform:uppercase;letter-spacing:.09em}
label.t-fld{display:grid;gap:4px;font-size:11px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase}
label.t-fld .t-in,label.t-fld select{text-transform:none;letter-spacing:0}
.t-wave{display:block;background:var(--line)}
</style>

  var colHTML=cols.map(function(c){
    var a=actById(c.activityId);

    else if(a&&c.type==="individual"&&a.stage===1){chipTxt="Stage: Individual";chipKind="amber";}
    var meta=(c.type==="team"?"Team · ":"Individual · ")+c.phase+" · "+(c.scale==="ci"?"C/I":c.max+" pts");

  /* rows */

    var target=teamSetForActivity(firstActivity().id).size;
    var behind=inCount<target-1||cellFor(tCol.id,t.id).st==="none";
    var collapsed=!!state.collapsed[t.id];
    rows+='<tr class="t-rowteam"><th scope="row" class="t-gbname"><div class="t-namecell">'+
      '<button class="t-caret" data-act="teamToggle:'+t.id+'">'+icon(collapsed?"chevright":"chevdown",18)+'</button>'+
      '<span style="white-space:nowrap">'+esc(t.name)+'</span><span class="t-spacer"></span>'+
      '<span style="font-size:11px;color:'+(behind?"var(--amber)":"var(--ink2)")+';white-space:nowrap" class="t-num">'+inCount+"/"+t.members.length+' in'+(behind?"  ⚠":"")+'</span></div></th>'+
      cols.map(function(c){return cellHTML(c,t.id,true);}).join("")+'</tr>';

      rows+='<tr class="t-rowstu"><th scope="row" class="t-gbname"><div class="t-namecell">'+avatar(m,20)+'<span style="white-space:nowrap">'+esc(m)+'</span></div></th>'+
        cols.map(function(c){return cellHTML(c,m,false);}).join("")+'</tr>';

      cols.map(function(c){return cellHTML(c,m,false);}).join("")+'</tr>';
  });
  h+='<div class="t-gbwrap"><table class="t-gb"><thead>'+
    '<tr><th class="t-gbname hdr">Student / team</th>'+grpHTML+'</tr>'+
    '<tr><th class="t-gbname hdr"></th>'+colHTML+'</tr>'+
    '</thead><tbody>'+rows+'</tbody></table></div>';
  return h+'</section>';
}

  }else if(state.facultyTab==="submission"){

      '<div class="t-card" style="padding:14px"><div class="t-kicker">Round 2 · '+esc(r2kind)+'</div><div style="font-family:var(--serif);font-size:30px;font-weight:700;margin:7px 0 2px" class="t-num">'+esc(r2val)+'</div><div style="font-size:12.5px;color:var(--ink2)">'+esc(r2note)+'</div></div>'+
      '<div class="t-card" style="padding:14px;display:flex;flex-direction:column;justify-content:space-between"><div style="font-size:12.5px;color:var(--ink2)">Faculty see what was submitted — per student and per team. Transcription confirmation is a separate step from grading.</div><button class="t-btn primary" style="margin-top:10px" data-act="wsReview">Review student responses</button></div></div>';

      set.teams.map(function(t){
        var r1in=t.members.filter(function(m){return cellFor(iCol.id,m).st!=="none";}).length;

        return '<tr><td style="padding:7px 11px;border-bottom:1px solid var(--line2);font-weight:500">'+esc(t.name)+'</td><td style="padding:7px 11px;border-bottom:1px solid var(--line2)" class="t-num">'+r1in+' / '+t.members.length+'</td><td style="padding:7px 11px;border-bottom:1px solid var(--line2)">'+chip(r2,kind)+'</td><td style="padding:7px 11px;border-bottom:1px solid var(--line2);color:var(--ink2);font-size:12.5px">'+esc(t.members.map(function(m){return m.split(" ")[0];}).join(", "))+'</td></tr>';

  }).join("");
  return '<div class="t-overlay">'+
    '<div style="display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper2);position:sticky;top:0;z-index:2;flex-wrap:wrap"><button class="t-btn ghost" style="border:1px solid var(--line)" data-act="revClose">← Back</button><div style="min-width:0"><div style="font-family:var(--serif);font-size:17px;font-weight:700">Student responses · '+esc(av.title)+'</div><div style="font-size:11.5px;color:var(--ink2)">Every student\'s response, flagged or not. Confirming a transcription is a faculty step, distinct from grading.</div></div></div>'+
    '<div style="padding:14px 16px 60px;max-width:900px;margin:0 auto"><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px">'+filters.map(function(f){return '<button class="t-pill'+(state.revFilter===f[0]?" on":"")+'" data-act="revFilter:'+f[0]+'">'+esc(f[1])+' · '+f[2]+'</button>';}).join("")+'</div>'+
      (cards?'':'<div style="border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--ink2);font-size:13px">Nothing in this filter. Every student\'s response stays reachable under All.</div>')+
      '<div style="display:flex;flex-direction:column;gap:12px">'+cards+'</div></div></div>';
}

/* ---------- MODAL ---------- */
function modalHTML(){
  if(!state.modal)return "";
  return '<div class="t-modalback" data-act="modalClose"><div class="t-modal" data-act="modalStop"><div style="display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line)"><span style="font-size:12.5px;color:var(--ink2);flex:1;min-width:0">'+esc(state.modal.caption)+'</span><button class="t-btn ghost" style="border:1px solid var(--line);padding:2px 8px" data-act="modalClose">✕</button></div>'+
    '<div style="padding:20px;background:repeating-linear-gradient(var(--paper2) 0px,var(--paper2) 37px,var(--line2) 37px,var(--line2) 38px)">'+state.modal.lines.map(function(l){return '<div style="font-family:var(--hand);font-size:25px;line-height:38px;color:var(--ink)">'+esc(l)+'</div>';}).join("")+'</div></div></div>';
}

/* ---------- RENDER ---------- */
function render(focus){
  var f=focus||captureFocus();
  applyTheme();
  var body;
  if(state.tab==="checkins")body=viewCheckins();
  else if(state.tab==="teams")body=viewRoster();
  else body=viewActivities();
  var html='<div class="t-shell'+(state.narrow?" t-narrow":"")+'">'+
    (state.narrow?"":sidebar())+
    '<main class="t-main"><div class="t-canvas">'+(state.narrow?topStrip():"")+body+'</div></main>'+
    (state.narrow?bottomNav():"")+
    panelHTML()+reviewHTML()+modalHTML()+
  '</div>';
  app.innerHTML=html;
  restoreFocus(f);
}

/* ---------- MUTATIONS ---------- */
function switchClass(id){
  var roster=state.classRosters[id]||[];
  var firstSet=Object.keys(state.teamSets).map(function(k){return state.teamSets[k];}).filter(function(s){return s.classId===id;})[0];
  state.classId=id;state.roster=roster;state.teamSetId=firstSet?firstSet.id:state.teamSetId;
  state.open=null;state.collapsed={};state.revOpen=false;state.activityView=null;
  var act=state.activities.filter(function(a){return a.classId===id;})[0];
  state.form.activity=act?act.id:state.form.activity;
}
function setTeams(fn){var s=curSet();var r=fn(s);for(var k in r)s[k]=r[k];}
function autoForm(){
  var set=curSet();var size=set.size;var pool=state.roster.slice();var teams=[];
  var names=["Team Helix","Team Ribosome","Team Vesicle","Team Mitosis","Team Cytosol","Team Axon","Team Lysosome","Team Codon","Team Flagellum","Team Nucleus","Team Golgi","Team Plasmid"];
  for(var i=0;i<pool.length;i+=size){var members=pool.slice(i,i+size);teams.push({id:"g"+i+"_"+Date.now(),name:names[teams.length]||("Team "+(teams.length+1)),members:members,roles:members.map(function(m,j){return ROLES[j%5];})});}
  setTeams(function(){return{teams:teams,locked:false};});
}
function openCell(colId,entityId,isTeamRow){var c=cellFor(colId,entityId);state.open={colId:colId,entityId:entityId,isTeamRow:isTeamRow};state.panelScore=c.st==="scored"?String(c.score):"";}
function markComplete(){var o=state.open;if(!o)return;var col=colById(o.colId);var raw=(state.panelScore||"").trim();var val=col&&col.scale==="ci"?{st:"scored",score:"✓",ci:true}:{st:"scored",score:raw===""?(col?col.max:10):raw};state.cells[o.colId+"|"+o.entityId]=val;}
function saveNext(){var o=state.open;if(!o)return;markComplete();var teams=gbTeams();var list=o.isTeamRow?teams.map(function(t){return t.id;}):state.roster;var i=list.indexOf(o.entityId);var next=list[(i+1)%list.length];var c=cellFor(o.colId,next);state.open={colId:o.colId,entityId:next,isTeamRow:o.isTeamRow};state.panelScore=c.st==="scored"?String(c.score):"";}

/* ---------- EVENTS ---------- */
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var parts=el.dataset.act.split(":");var act=parts[0];var arg=parts[1];
  var d=el.dataset;
  switch(act){
    case "noop": return;
    case "modalStop": e.stopPropagation(); return;
    case "tab": state.tab=arg;state.revOpen=false;break;
    case "switchClass": switchClass(arg);break;
    case "toggleTheme": state.theme=(effectiveTheme()==="dark"?"light":"dark");break;
    case "gbAddToggle": state.addOpen=!state.addOpen;break;
    case "gbAddCancel": state.addOpen=false;break;
    case "gbAddSubmit": return;
    case "gbLegend": state.legendOpen=!state.legendOpen;break;
    case "groupOpen": state.tab="activities";state.activityView=arg;state.lens="faculty";state.facultyTab="submission";break;
    case "colOpen": state.tab="activities";state.activityView=arg;state.lens="faculty";state.facultyTab="submission";break;
    case "teamToggle": state.collapsed[arg]=!state.collapsed[arg];break;
    case "openCell": openCell(d.col,d.entity,d.teamrow==="1");break;
    case "panelClose": state.open=null;break;
    case "panelComplete": markComplete();break;
    case "panelFlag": if(state.open)state.cells[state.open.colId+"|"+state.open.entityId]={st:"flag"};break;
    case "panelSaveNext": saveNext();break;
    case "panelEnlarge": {var o=state.open;if(o){var col=colById(o.colId);var teams=gbTeams();var team=o.isTeamRow?teams.filter(function(t){return t.id===o.entityId;})[0]:null;var subj=o.isTeamRow?(team?team.name:o.entityId):o.entityId;var resp=state.responses.filter(function(r){return r.name===o.entityId;})[0];var lines=o.isTeamRow?TEAM_ANSWER:(resp?resp.lines:["No scan on file."]);state.modal={caption:subj+" · "+col.label+" · "+(o.isTeamRow?"Round 2":"Round 1"),lines:lines};}break;}
    case "panelOpenWs": {var o2=state.open;if(o2){var c2=colById(o2.colId);state.tab="activities";state.activityView=c2.activityId;state.lens="faculty";state.facultyTab="submission";state.open=null;}break;}
    case "teamSetSelect": state.teamSetId=arg;break;
    case "teamDelete": setTeams(function(s){return{teams:s.teams.filter(function(x){return x.id!==arg;})};});break;
    case "teamAddMatch": setTeams(function(s){return{teams:s.teams.map(function(x){if(x.id!==d.team)return x;return{id:x.id,name:x.name,members:x.members.concat([d.name]),roles:x.roles.concat([ROLES[x.members.length%5]])};})};});state.queries[d.team]="";break;
    case "memberRole": setTeams(function(s){return{teams:s.teams.map(function(x){if(x.id!==d.team)return x;var idx=+d.idx;return{id:x.id,name:x.name,members:x.members,roles:x.roles.map(function(r,j){return j===idx?ROLES[(ROLES.indexOf(r)+1)%5]:r;})};})};});break;
    case "memberRemove": setTeams(function(s){return{teams:s.teams.map(function(x){if(x.id!==d.team)return x;var idx=+d.idx;return{id:x.id,name:x.name,members:x.members.filter(function(_,j){return j!==idx;}),roles:x.roles.filter(function(_,j){return j!==idx;})};})};});break;
    case "rosterUpload": {var names=state.classId==="AP50B"?ROSTER_B:ROSTER;var merged=state.classRosters[state.classId].slice();names.forEach(function(n){if(merged.indexOf(n)<0)merged.push(n);});state.classRosters[state.classId]=merged;state.roster=merged;state.uploadNote[state.classId]="roster-"+state.classId.toLowerCase()+".csv · "+names.length+" students imported";break;}
    case "addStudent": {var add=state.newStudent.split(/[\n,]/).map(function(x){return x.trim();}).filter(Boolean);if(add.length){var m2=state.roster.concat(add);state.roster=m2;state.classRosters[state.classId]=m2;state.newStudent="";}break;}
    case "autoForm": autoForm();break;
    case "assignRoles": setTeams(function(s){return{teams:s.teams.map(function(t){return{id:t.id,name:t.name,members:t.members,roles:t.members.map(function(m,i){return ROLES[i%5];})};})};});break;
    case "addTeam": setTeams(function(s){return{teams:s.teams.concat([{id:"n"+Date.now(),name:"New team",members:[],roles:[]}])};});break;
    case "publish": setTeams(function(s){return{locked:!s.locked};});break;
    case "actNew": {var na={id:"a"+Date.now(),classId:state.classId,week:activitiesOfClass().length+1,topic:"Untitled",dates:"TBD",title:"Untitled activity",stage:0,resubmitMode:"team",r1:0,r2:0,posted:false,brief:{heading:"Untitled activity",paras:["Add the prompt, reading, or case body here."],files:[]}};state.activities.push(na);state.activityView=na.id;state.lens="faculty";state.facultyTab="source";break;}
    case "actOpen": state.activityView=arg;state.lens="faculty";state.facultyTab="source";break;
    case "wsBack": state.activityView=null;break;
    case "wsLens": state.lens=arg;break;
    case "wsTab": state.facultyTab=arg;break;
    case "wsReview": state.revOpen=true;break;
    case "wsPost": {var avp=actById(state.activityView);if(avp)avp.posted=true;break;}
    case "stuStep": {var av2=actById(state.activityView);if((+arg)>1&&state.r1Status!=="submitted")return;state.stuStep=+arg;break;}
    case "stuDrop": state.r1File="irat-case4-photo.jpg · 1.4 MB attached";break;
    case "stuSubmitR1": state.r1Status="submitted";state.stuStep=2;break;
    case "stuAddResource": {var txt=(state.resourceText||"").trim()||"Uploaded file · scratch-notes.jpg";var mt=curSet().teams[0];state.resources.push({text:txt,by:(mt?mt.members[0]:"You")+" · added just now"});state.resourceText="";break;}
    case "stuFork": state.r2Fork=arg;break;
    case "stuSubmitR2": state.r2Status="submitted";break;
    case "revClose": state.revOpen=false;break;
    case "revFilter": state.revFilter=arg;break;
    case "revConfirm": {var ri=+arg;var elc=app.querySelector('[data-fid="tr_'+ri+'"]');if(elc)state.responses[ri].override=elc.innerText;state.responses[ri].status="confirmed";state.responses[ri].editing=false;break;}
    case "revEdit": {var re=+arg;var r=state.responses[re];if(r.editing){var elr=app.querySelector('[data-fid="tr_'+re+'"]');if(elr)r.override=elr.innerText;r.editing=false;}else{state.responses.forEach(function(x){x.editing=false;});r.editing=true;}break;}
    case "revEnlarge": {var rr=state.responses[+d.idx];state.modal={caption:rr.name+" · iRAT · Round 1 · individual",lines:rr.lines};break;}
    case "modalClose": state.modal=null;break;
    default: return;
  }
  render();
});

/* form submit (add check-in) */
app.addEventListener("submit",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  if(el.dataset.act==="gbAddSubmit"){
    e.preventDefault();
    var f=state.form;var id="c"+Date.now();
    state.columns.push({id:id,activityId:f.activity,label:f.label||"New check-in",type:f.type,phase:f.phase,scale:f.scale,max:f.scale==="ci"?1:10});
    state.addOpen=false;state.form.label="";
    render();
  }
});

/* field edits */
function onEdit(e){
  var el=e.target;var f=el.dataset.field;if(!f||el.isContentEditable)return;
  if((el.dataset.evt||"input")!==e.type)return;
  var fc=captureFocus();var v=el.value;var d=el.dataset;
  switch(f){
    case "score": state.panelScore=v;break;
    case "newStudent": state.newStudent=v;break;
    case "resourceText": state.resourceText=v;break;
    case "r1Text": state.r1Text=v;break;
    case "r2Text": state.r2Text=v;break;
    case "f_label": state.form.label=v;break;
    case "f_type": state.form.type=v;break;
    case "f_phase": state.form.phase=v;break;
    case "f_scale": state.form.scale=v;break;
    case "f_activity": state.form.activity=v;break;
    case "teamName": setTeams(function(s){return{teams:s.teams.map(function(x){return x.id===d.team?{id:x.id,name:v,members:x.members,roles:x.roles}:x;})};});break;
    case "teamQuery": state.queries[d.team]=v;break;
    case "teamSize": {var n=Math.max(2,Math.min(8,Number(v)||2));setTeams(function(){return{size:n};});autoForm();break;}
    default: return;
  }
  render(fc);
}
app.addEventListener("input",onEdit);
app.addEventListener("change",onEdit);

/* resize -> narrow toggle */
window.addEventListener("resize",function(){var n=window.innerWidth<820;if(n!==state.narrow){state.narrow=n;render();}});

/* boot */
render();
})();
</script>
